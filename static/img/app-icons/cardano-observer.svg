<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <radialGradient id="dotGlow" cx="35%" cy="35%" r="65%">
      <stop offset="0%" stop-color="#60a5fa" />
      <stop offset="60%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </radialGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Canvas (Rounded Squircle for App Store / Cardano.org style) -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect width="508" height="508" x="2" y="2" rx="110" fill="none" stroke="#1e293b" stroke-width="2" stroke-opacity="0.8" />

  <!-- Subtle ambient inner glow -->
  <circle cx="395" cy="355" r="100" fill="#3b82f6" opacity="0.15" />

  <!-- Geometric C Glyph (Pure Vector - Zero Font Dependency) -->
  <path d="M 330 160
           C 300 125 255 105 205 105
           C 120 105 55 172 55 256
           C 55 340 120 407 205 407
           C 255 407 300 387 330 352"
        fill="none"
        stroke="#f8fafc"
        stroke-width="52"
        stroke-linecap="round"
        stroke-linejoin="round"
        filter="url(#shadow)" />

  <!-- Observer Pulse Dot (Cardano Blue) -->
  <circle cx="395" cy="355" r="44" fill="url(#dotGlow)" filter="url(#shadow)" />
  <circle cx="395" cy="355" r="44" fill="none" stroke="#93c5fd" stroke-width="3" opacity="0.5" />
</svg>
